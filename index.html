<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm Triết học Mác – Lênin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f5f7;--card:#fff;--ink:#16242b;--mute:#5c6b73;--line:#d5dde2;--brand:#0f4c5c;--brand-ink:#fff;
--ok:#1e7f4f;--ok-bg:#e3f4ea;--no:#b3362f;--no-bg:#fbe7e5;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181c;--card:#18242a;--ink:#e8eef1;--mute:#9aaab2;--line:#2c3c44;--brand:#5fb4c9;--brand-ink:#0b1a20;--ok:#5fd394;--ok-bg:#15301f;--no:#ff8f86;--no-bg:#3a1b19;color-scheme:dark}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;line-height:1.3;margin:8px 0 6px}
p{margin:0 0 12px}.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.range input{width:84px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mute)}
.q{font-size:1.1rem;font-weight:500;margin-bottom:16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:12px 14px;line-height:1.5}
.opt b{flex:none;width:1.6em;color:var(--mute)}
.opt:not(:disabled):hover{border-color:var(--brand)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.no{background:var(--no-bg);border-color:var(--no)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin:6px 0 16px;padding:12px 14px;border-radius:10px;font-weight:500}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.no{background:var(--no-bg);color:var(--no)}
.big{font-size:2.4rem;font-weight:700;line-height:1.2}
.wrong{border-top:1px solid var(--line);padding:12px 0}
.wrong small{color:var(--mute)}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var DATA = [{"n":1,"q":"Hệ thống triết học nào quan niệm triết học là “yêu mến sự thông thái”?","a":"c","opts":[{"k":"a","t":"Triết học Trung Quốc Cổ đại"},{"k":"b","t":"Triết học Ấn Độ cổ đại"},{"k":"c","t":"Triết học Hy Lạp cổ đại"},{"k":"d","t":"Triết học cổ điển Đức"}]},{"n":2,"q":"Hệ thống triết học nào quan niệm triết học là “chiêm ngưỡng”, hàm ý là tri thức dựa trên lý trí, là con đường suy nghĩ để dẫn dắt con người đến với lẽ phải.","a":"b","opts":[{"k":"a","t":"Triết học Trung Quốc Cổ đại"},{"k":"b","t":"Triết học Ấn Độ cổ đại"},{"k":"c","t":"Triết học Hy Lạp cổ đại"},{"k":"d","t":"Triết học cổ điển Đức"}]},{"n":3,"q":"Hệ thống triết học nào quan niệm: “Triết học là hệ thống quan điểm lý luận chung nhất về thế giới và vị trí con con người trong thế giới đó, là khoa học về những quy luật vận động, phát triển chung nhất của tự nhiên, xã hội và tư duy”","a":"c","opts":[{"k":"a","t":"Triết học Trung Quốc Cổ đại"},{"k":"b","t":"Triết học Ấn Độ cổ đại"},{"k":"c","t":"Triết học Mác – Lênin"},{"k":"d","t":"Triết học cổ điển Đức"}]},{"n":4,"q":"Điền thuật ngữ chính xác vào chỗ trống: “Triết học là hệ thống quan điểm ………về thế giới và vị trí con người trong thế giới đó, là khoa học về những quy luật vận động, phát triển chung nhất của tự nhiên, xã hội và tư duy”","a":"a","opts":[{"k":"a","t":"Lý luận chung nhất"},{"k":"b","t":"Lý luận"},{"k":"c","t":"Thực tiễn"},{"k":"d","t":"Kinh nghiệm"}]},{"n":5,"q":"Triết học bao gồm quan điểm chung nhất, những sự lý giải có luận chứng cho các câu hỏi chung của con người nên triết học bao gồm toàn bộ tri thức của nhân loại. Kết luận trên ứng với triết học thời kỳ nào?","a":"a","opts":[{"k":"a","t":"Triết học cổ đại. (Giai đoạn triết học là \"khoa học của các khoa học\"."},{"k":"b","t":"Triết học Phục Hưng."},{"k":"c","t":"Triết học Trung cổ Tây Âu."},{"k":"d","t":"Triết học Mác – Lênin."}]},{"n":6,"q":"Triết học ra đời từ mấy nguồn gốc?","a":"a","opts":[{"k":"a","t":"2 (Nguồn gốc nhận thức và nguồn gốc xã hội."},{"k":"b","t":"3"},{"k":"c","t":"4"},{"k":"d","t":"5"}]},{"n":7,"q":"Nguồn gốc ra đời của triết học?","a":"a","opts":[{"k":"a","t":"Nguồn gốc nhận thức và nguồn gốc xã hội."},{"k":"b","t":"Nguồn gốc nhận thức, nguồn gốc xã hội và nguồn gốc giai cấp."},{"k":"c","t":"Nguồn gốc tự nhiên, nguồn gốc xã hội và nguồn gốc tư duy."},{"k":"d","t":"Nguồn gốc tự nhiên và nguồn gốc tư duy."}]},{"n":8,"q":"Trong xã hội có giai cấp, triết học:","a":"a","opts":[{"k":"a","t":"Có tính giai cấp."},{"k":"b","t":"Không có tính giai cấp."},{"k":"c","t":"Chỉ triết học phương Tây mới có tính giai cấp."},{"k":"d","t":"Tùy từng học thuyết cụ thể."}]},{"n":9,"q":"Triết học tự nhiên đã được những thành tựu rực rỡ trong nền triết học nào?","a":"c","opts":[{"k":"a","t":"Triết học Trung Quốc Cổ đại"},{"k":"b","t":"Triết học Ấn Độ cổ đại"},{"k":"c","t":"Triết học Hy Lạp cổ đại"},{"k":"d","t":"Triết học cổ điển Đức"}]},{"n":10,"q":"Điền thuật ngữ chính xác vào chỗ trống: “Triết học Mác xác định đối tượng nghiên cứu của mình là tiếp tục giải quyết mối quan hệ giữa tồn tại và tư duy, giữa vật chất và ý thức trên lập trường duy vật triệt để và nghiên cứu những ………..của tự nhiên, xã hội và tư duy”","a":"a","opts":[{"k":"a","t":"Quy luật chung nhất"},{"k":"b","t":"Quy luật đặc thù"},{"k":"c","t":"Quy luật"},{"k":"d","t":"Quy luật khoa học"}]},{"n":11,"q":"Thế giới quan bao gồm những thành phần chủ yếu nào?","a":"d","opts":[{"k":"a","t":"Tri thức"},{"k":"b","t":"Niềm tin"},{"k":"c","t":"Lý tưởng"},{"k":"d","t":"Tất cả đáp án của câu này đều đúng (Tri thức là hạt nhân, kết hợp với niềm tin, lý tưởng...."}]},{"n":12,"q":"Thành phần nào sau đây thuộc về thế giới quan?","a":"d","opts":[{"k":"a","t":"Kinh tế"},{"k":"b","t":"Xã hội"},{"k":"c","t":"Chính trị"},{"k":"d","t":"Tri thức"}]},{"n":13,"q":"Thế giới quan bao gồm những hình thức cơ bản nào?","a":"d","opts":[{"k":"a","t":"Thế giới quan tôn giáo"},{"k":"b","t":"Thế giới quan thần thoại"},{"k":"c","t":"Thế giới quan triết học"},{"k":"d","t":"Tất cả đáp án của câu này đều đúng"}]},{"n":14,"q":"Nội dung cơ bản của thế giới quan bao gồm:","a":"d","opts":[{"k":"a","t":"Vũ trụ quan (triết học về giới tự nhiên.."},{"k":"b","t":"Xã hội quan (triết học về xã hội.."},{"k":"c","t":"Nhân sinh quan."},{"k":"d","t":"Cả a, b, c"}]},{"n":15,"q":"Hạt nhân chủ yếu của thế giới quan là gì?","a":"b","opts":[{"k":"a","t":"Các quan điểm xã hội – chính trị."},{"k":"b","t":"Các quan điểm triết học."},{"k":"c","t":"Các quan điểm mỹ học."},{"k":"d","t":"Cả a, b, c"}]},{"n":16,"q":"Thế giới quan có ý nghĩa trên những phương diện nào?","a":"c","opts":[{"k":"a","t":"Trên phương diện lý luận"},{"k":"b","t":"Trên phương diện thực tiễn"},{"k":"c","t":"Cả a và b"},{"k":"d","t":"Tất cả đáp án đều sai"}]},{"n":17,"q":"Thế giới quan khoa học dựa trên lập trường triết học nào?","a":"b","opts":[{"k":"a","t":"Chủ nghĩa duy tâm chủ quan."},{"k":"b","t":"Chủ nghĩa duy tâm khác quan."},{"k":"c","t":"Chủ nghĩa duy vật."},{"k":"d","t":"Nhị nguyên luận."}]},{"n":18,"q":"Vấn đề cơ bản của triết học là:","a":"b","opts":[{"k":"a","t":"Quan hệ giữa tư duy với tồn tại và khả năng nhận thức của con người"},{"k":"b","t":"Quan hệ giữa vật chất với ý thức, tinh thần với tự nhiên và con người có khả năng nhận thức được thế giới không?"},{"k":"c","t":"Quan hệ giữa vật chất với ý thức; tinh thần với tự nhiên; tư duy với tồn tại và con người có khả năng nhận thức được thế giới không?"},{"k":"d","t":"Khả năng nhận thức của con người"}]},{"n":19,"q":"Mặt thứ nhất vấn đề cơ bản của triết học là gì?","a":"b","opts":[{"k":"a","t":"Vấn đề mối quan hệ giữa Trời và Đất"},{"k":"b","t":"Vấn đề mối quan hệ giữa vật chất và ý thức (Cái nào có trước, cái nào quyết định."},{"k":"c","t":"Vấn đề hiện sinh của con người."},{"k":"d","t":"Tất cả các đáp án trên"}]},{"n":20,"q":"Mặt thứ hai vấn đề cơ bản của triết học là gì?","a":"a","opts":[{"k":"a","t":"Khả năng nhận thức của con người"},{"k":"b","t":"Khả năng cải tạo thế giới"},{"k":"c","t":"Khả năng quan sát của con người"},{"k":"d","t":"Tất cả các phương  Biện chứng tự phát là gì?","a":"c","opts":[{"k":"a","t":"Là biện chứng của bản thân thế giới khách quan."},{"k":"b","t":"Là biện chứng chủ quan thuần tuý."},{"k":"c","t":"Là biện chứng của bản thân thế giới khách quan khi con người chưa nhận thức được."},{"k":"d","t":"Là những yếu tố biện chứng con người đạt được trong quá trình tìm hiểu thế giới nhưng chưa có hệ thống."}]},{"n":63,"q":") Theo quan niệm của chủ nghĩa duy vật biện chứng giữa biện chứng chủ quan và biện chứng khách quan quan hệ với nhau như thế nào?","a":"c","opts":[{"k":"a","t":"Biện chứng chủ quan quyết định biện chứng khách quan"},{"k":"b","t":"Biện chứng chủ quan hoàn toàn độc lập với biện chứng khách quan"},{"k":"c","t":"Biện chứng chủ quan phản ánh biện chứng khách quan"},{"k":"d","t":"Biện chứng khách quan là sự thể hiện của biện chứng chủ quan"}]},{"n":64,"q":"Đặc điểm của chủ nghĩa duy vật biện chứng về không gian và thời gian. Vì sao nói không gian và thời gian là hình thức tồn tại của vật chất? Chọn phương án trả lời đúng nhất về không gian và thời gian:","a":"c","opts":[{"k":"a","t":"Không gian là hình thức tồn tại của vật chất, còn thời gian là phương thức tồn tại của vật chất."},{"k":"b","t":"Không gian là phương thức tồn tại của vật chất, còn thời gian là hình thức tồn tại của vật chất"},{"k":"c","t":"Không gian và thời gian là những hình thức tồn tại cơ bản của vật chất."},{"k":"d","t":"Không gian và thời gian là những phương thức cơ bản của tồn tại vật chất."}]},{"n":65,"q":") Mọi dạng cụ thể của vật chất đều tồn tại ở một vị trí nhất định, có một quảng tính (chiều cao, chiều rộng, chiều dài) nhất định và tồn tại trong các mối tương quan nhất định (trước hay sau, trên hay dưới, bên phải hay bên trái, v.v…) với những dạng vật chất khác. Những hình thức tồn tại như vậy được gọi là gì?","a":"b","opts":[{"k":"a","t":"Mối liên hệ"},{"k":"b","t":"Không gian."},{"k":"c","t":"Thời gian"},{"k":"d","t":"Vận động"}]},{"n":66,"q":"Trình bày quan điểm của chủ nghĩa duy vật biện chứng về tính thốn var app = document.getElementById("app");
var S = {order:[], pos:0, ans:{}, wrongIds:[]};
try { S.wrongIds = JSON.parse(localStorage.getItem("triet_wrong") || "[]"); } catch (e) {}
function saveWrong(){ try { localStorage.setItem("triet_wrong", JSON.stringify(S.wrongIds)); } catch (e) {} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function home(){
  var n = DATA.length;
  app.innerHTML =
    '<h1>Trắc nghiệm Triết học Mác – Lênin</h1>' +
    '<p class="mute">' + n + ' câu. Chọn đáp án để biết đúng hay sai ngay, câu sai sẽ được lưu để ôn lại.</p>' +
    '<div class="card"><p><b>Chọn phạm vi câu</b></p>' +
    '<div class="row range" style="margin-bottom:16px"><label>Từ câu <input id="from" type="number" min="1" max="' + n + '" value="1"></label>' +
    '<label>đến câu <input id="to" type="number" min="1" max="' + n + '" value="' + n + '"></label></div>' +
    '<div class="row"><button class="primary" id="go1">Làm theo thứ tự</button><button id="go2">Làm ngẫu nhiên</button>' +
    (S.wrongIds.length ? '<button id="go3">Ôn ' + S.wrongIds.length + ' câu từng sai</button>' : '') + '</div></div>';
  function range(){
    var f = Math.max(1, parseInt(document.getElementById("from").value) || 1);
    var t = Math.min(n, parseInt(document.getElementById("to").value) || n);
    var r = []; for (var i = 0; i < n; i++) if (DATA[i].n >= f && DATA[i].n <= t) r.push(i); return r;
  }
  document.getElementById("go1").onclick = function(){ start(range()); };
  document.getElementById("go2").onclick = function(){ start(shuffle(range())); };
  var g3 = document.getElementById("go3");
  if (g3) g3.onclick = function(){ start(shuffle(S.wrongIds.filter(function(i){ return DATA[i]; }))); };
}

function start(order){
  if (!order.length) { alert("Không có câu nào trong phạm vi này."); return; }
  S.order = order; S.pos = 0; S.ans = {}; show();
}

function show(){
  var idx = S.order[S.pos], q = DATA[idx], total = S.order.length, a = S.ans[idx];
  var h = '<div class="top"><span>Câu ' + (S.pos + 1) + '/' + total + ' (câu gốc số ' + q.n + ')</span><button onclick="home()">Thoát</button></div>' +
    '<div class="bar"><i style="width:' + (S.pos / total * 100) + '%"></i></div><div class="card"><div class="q">' + esc(q.q) + '</div>';
  q.opts.forEach(function(o){
    var cls = "";
    if (a) { if (o.k === q.a) cls = " ok"; else if (o.k === a) cls = " no"; }
    h += '<button class="opt' + cls + '" data-k="' + o.k + '"' + (a ? " disabled" : "") + '><b>' + o.k + '.</b><span>' + esc(o.t) + '</span></button>';
  });
  if (a) {
    var right = DATA[idx].opts.filter(function(o){ return o.k === q.a; })[0];
    h += a === q.a ? '<div class="fb ok">Đúng rồi!</div>' : '<div class="fb no">Sai. Đáp án đúng là ' + q.a + '. ' + esc(right.t) + '</div>';
    h += '<button class="primary" id="next">' + (S.pos + 1 < total ? "Câu tiếp theo" : "Xem kết quả") + '</button>';
  }
  h += '</div>';
  app.innerHTML = h; window.scrollTo(0, 0);
  Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-k"); S.ans[idx] = k;
      var i = S.wrongIds.indexOf(idx);
      if (k !== q.a) { if (i < 0) S.wrongIds.push(idx); } else if (i >= 0) S.wrongIds.splice(i, 1);
      saveWrong(); show();
    };
  });
  var nx = document.getElementById("next");
  if (nx) nx.onclick = function(){ S.pos++; if (S.pos < total) show(); else finish(); };
}

function finish(){
  var total = S.order.length, ok = 0, bad = [];
  S.order.forEach(function(i){ if (S.ans[i] === DATA[i].a) ok++; else bad.push(i); });
  var h = '<h1>Kết quả</h1><div class="card"><div class="big">' + ok + '/' + total + '</div><p class="mute">Đúng ' + Math.round(ok / total * 100) + '%</p>' +
    '<div class="row"><button class="primary" id="again">Làm lại từ đầu</button>' + (bad.length ? '<button id="redo">Làm lại ' + bad.length + ' câu sai</button>' : '') + '<button onclick="home()">Về trang chính</button></div></div>';
  if (bad.length) {
    h += '<div class="card"><p><b>Các câu sai</b></p>';
    bad.forEach(function(i){
      var q = DATA[i], r = q.opts.filter(function(o){ return o.k === q.a; })[0];
      h += '<div class="wrong"><small>Câu ' + q.n + '</small><div>' + esc(q.q) + '</div><div class="fb ok" style="margin:8px 0 0">' + q.a + '. ' + esc(r.t) + '</div></div>';
    });
    h += '</div>';
  }
  app.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById("again").onclick = function(){ start(S.order); };
  var rd = document.getElementById("redo"); if (rd) rd.onclick = function(){ start(bad); };
}
home();
</script>
</body>
</html>
